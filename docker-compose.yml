services:
  web:
    container_name: chronos-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - "${FRONT_PORT:-3000}:80"
    networks:
      - app_network
    depends_on:
      - api

  api:
    container_name: chronos-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - "${BACK_PORT:-3001}:${BACK_PORT:-3001}"
    env_file:
      - ./apps/api/.env.local
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - BACK_PORT=${BACK_PORT:-3001}
      - BACK_HOST=${BACK_HOST:-0.0.0.0}
      - FRONT_HOST=${FRONT_HOST:-localhost}
      - FRONT_PORT=${FRONT_PORT:-5173}
      # MongoDB Atlas URI - используем облачную БД
      - MONGODB_URI=mongodb+srv://tesluakevlad_db_user:D4uxcoYQRb2JcYrb@chronos.xaixkpi.mongodb.net/chronos?retryWrites=true&w=majority&appName=chronos
      - DB_NAME=${DB_NAME:-chronos}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_LIFETIME=${ACCESS_TOKEN_LIFETIME:-15m}
      - REFRESH_TOKEN_LIFETIME=${REFRESH_TOKEN_LIFETIME:-7d}
      - ACCESS_TOKEN_NAME=${ACCESS_TOKEN_NAME:-access_token}
      - REFRESH_TOKEN_NAME=${REFRESH_TOKEN_NAME:-refresh_token}
      - CODE_LIFETIME=${CODE_LIFETIME:-5m}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
    networks:
      - app_network
    # Убираем зависимость от локальной MongoDB так как используем Atlas
    # depends_on:
    #   - mongodb

  # Local MongoDB for development only
  # ОТКЛЮЧЕНО: Используем MongoDB Atlas вместо локальной БД
  # mongodb:
  #   container_name: chronos-mongodb
